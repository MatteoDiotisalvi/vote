    --gold: #c9a84c;
    --gold-hi: #e2be5c;
    --ink: #2a1806;
    --cream: #f5efe3;
    --crimson: #7a1526;
    --navy: #1a2a5e;
    /* Width of the poster: full width on a phone, narrower than the window on wide screens */
    --w: min(100vw, 56.28vh);
    --w: min(100vw, 56.28dvh);
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  /* The dark ground goes on html only. A background on body would paint over the fixed backdrop layer. */
  html { background: #14060a; -webkit-text-size-adjust: 100%; height: 100%; overflow: hidden; }

  body {
    height: 100vh;
    height: 100dvh;
    display: flex;
    justify-content: center;
    overflow: hidden;
    overscroll-behavior: none;
    font-family: 'Cinzel', Georgia, serif;
    color: var(--cream);
    -webkit-tap-highlight-color: transparent;
  }

  /* Only visible on wide screens, where the poster does not fill the window */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: -1;
    background: var(--poster) center / cover no-repeat;
    filter: blur(24px) brightness(.5);
    transform: scale(1.15);
  }

  /* Hidden form controls. They hold the game state, so the game works even where scripts are blocked. */
  .ctl {
    position: absolute;
    left: -9999px;
    width: 1px;
    height: 1px;
    opacity: 0;
    pointer-events: none;
  }

  /* The poster. Everything on it is placed as a share of its height, so it lines up with the artwork. */
  .stage {
    position: relative;
    width: var(--w);
    height: 100vh;
    height: 100dvh;
    flex: none;
    overflow: hidden;
    background: var(--poster) center / cover no-repeat;
  }

  /* The question sits on the red curtain, between the crown banner and the heads */
  .title {
    position: absolute;
    left: 7%;
    right: 7%;
    top: 10.2%;
    height: 13.4%;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  h1 {
    font-family: 'Cinzel Decorative', Georgia, serif;
    font-weight: 900;
    font-size: calc(var(--w) * .06);
    line-height: 1.2;
    letter-spacing: .3px;
    color: var(--cream);
    text-wrap: balance;
    text-shadow: 0 2px 10px rgba(0,0,0,.95), 0 0 3px rgba(0,0,0,.9), 0 1px 2px rgba(0,0,0,.9);
  }

  /* The blank parchment banner at the bottom of the artwork */
  .panel {
    position: absolute;
    left: 8%;
    right: 8%;
    top: 84.4%;
    height: 13%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: calc(var(--w) * .008);
    text-align: center;
  }

  .buttons {
    display: flex;
    flex-wrap: nowrap;
    justify-content: center;
    align-items: center;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    line-height: 1;
    font-family: 'Cinzel', Georgia, serif;
    font-weight: 700;
    font-size: clamp(13px, calc(var(--w) * .04), 22px);
    text-transform: uppercase;
    letter-spacing: 1.5px;
    min-width: calc(var(--w) * .29);
    min-height: clamp(40px, calc(var(--w) * .115), 58px);
    padding: 0 calc(var(--w) * .04);
    border-radius: 3px;
    box-shadow: 0 3px 10px rgba(40,20,0,.45);
    cursor: pointer;
    touch-action: manipulation;
    -webkit-appearance: none;
    appearance: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    transition: background .2s ease, transform .2s ease, box-shadow .2s ease;
  }

  #yesBtn {
    background: linear-gradient(#e2be5c, #c9a03a);
    color: var(--ink);
    border: 3px solid #6b4a10;
  }
  #yesBtn:active { background: #e8c96e; }

  /* NO sits in the row next to YES until it first runs away */
  .no-slot {
    display: flex;
    margin-left: calc(var(--w) * .035);
    transition: width .4s ease, margin-left .4s ease;
  }

  #noBtn, .no-css {
    background: var(--navy);
    color: var(--cream);
    border: 3px solid var(--gold);
    transform-origin: center;
  }

  #noBtn {
    transition: left .28s cubic-bezier(.34,1.56,.64,1), top .28s cubic-bezier(.34,1.56,.64,1), transform .28s ease, opacity .35s ease, background .2s ease;
  }

  /* Hover styling only where a real mouse exists, so phones never get a stuck hover state */
  @media (hover: hover) {
    #yesBtn:hover { background: var(--gold-hi); transform: translateY(-2px); }
  }

  .counter {
    font-weight: 700;
    font-size: clamp(11px, calc(var(--w) * .034), 17px);
    color: var(--crimson);
  }

  .small-print {
    font-size: clamp(8px, calc(var(--w) * .024), 12px);
    font-style: italic;
    color: rgba(58,38,10,.75);
  }

  /* ---- Game without scripts: each tap on NO moves to the next spot, smaller, then it is gone ---- */
  html.js .no-css { display: none !important; }
  html:not(.js) #noBtn { display: none; }

  .no-r {
    display: none;
    position: absolute;
    z-index: 5;
    --sc: 1;
    transform: scale(var(--sc));
  }

  #n1:checked ~ .stage .no-r0,
  #n2:checked ~ .stage .no-r0,
  #n3:checked ~ .stage .no-r0,
  #n4:checked ~ .stage .no-r0 { visibility: hidden; }
  #n5:checked ~ .stage .no-r0 { display: none; }
  #n5:checked ~ .stage .no-slot { margin-left: 0; }

  #n1:checked ~ .stage .no-r1 { display: inline-flex; left: 64%; top: 29%; --sc: .9; animation: pop .28s ease-out; }
  #n2:checked ~ .stage .no-r2 { display: inline-flex; left: 5%;  top: 50%; --sc: .8; animation: pop .28s ease-out; }
  #n3:checked ~ .stage .no-r3 { display: inline-flex; left: 62%; top: 61%; --sc: .7; animation: pop .28s ease-out; }
  #n4:checked ~ .stage .no-r4 { display: inline-flex; left: 8%;  top: 73%; --sc: .6; animation: pop .28s ease-out; }

  @keyframes pop {
    from { opacity: 0; transform: scale(calc(var(--sc) * .4)); }
    to   { opacity: 1; transform: scale(var(--sc)); }
  }

  /* The notice drops in from the top edge, well away from YES at the bottom, and never takes a tap */
  .toast {
    position: fixed;
    left: 50%;
    top: max(14px, env(safe-area-inset-top));
    max-width: 90vw;
    padding: 12px 22px;
    border-radius: 4px;
    text-align: center;
    font-size: 14px;
    color: var(--cream);
    background: rgba(122,21,38,.96);
    border: 1px solid var(--gold);
    box-shadow: 0 4px 20px rgba(0,0,0,.6);
    opacity: 0;
    transform: translate(-50%, -160%);
    transition: opacity .4s ease, transform .4s ease;
    z-index: 1000;
    pointer-events: none;
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  #n5:checked ~ .toast { animation: toastShow 3.6s ease forwards; }
  @keyframes toastShow {
    0%   { opacity: 0; transform: translate(-50%, -160%); }
    10%  { opacity: 1; transform: translate(-50%, 0); }
    85%  { opacity: 1; transform: translate(-50%, 0); }
    100% { opacity: 0; transform: translate(-50%, -160%); }
  }

  .victory {
    position: fixed;
    inset: 0;
    z-index: 9999;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
    background: rgba(20,6,10,.96);
  }
  #won:checked ~ .victory { display: flex; }

  .victory h2 {
    font-family: 'Cinzel Decorative', Georgia, serif;
    font-size: clamp(30px, 9vw, 48px);
    color: var(--gold);
    margin-bottom: 16px;
    text-shadow: 0 4px 16px rgba(201,168,76,.6);
  }
  .victory p { font-size: 20px; margin-bottom: 32px; }

  .close-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-family: 'Cinzel', Georgia, serif;
    font-size: 16px;
    min-height: 48px;
    padding: 12px 36px;
    color: var(--gold);
    background: transparent;
    border: 2px solid var(--gold);
    border-radius: 3px;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-user-select: none;
    user-select: none;
  }
  .close-btn:active { background: var(--gold); color: #14060a; }

  /* Script-free sound: the browser's own player at normal width, clipped to a circle so only its play button at the left end shows */
  /* It appears exactly where YES was, so the second tap lands under the same thumb.
     YES sits left of centre while NO is still there (half of NO's slot plus the gap), and centred once NO is gone. */
  .sound {
    display: none;
    position: absolute;
    left: 50%;
    bottom: calc(11.4% - 30px);
    width: 210px;
    flex-direction: column-reverse;
    align-items: center;
    gap: 10px;
    transform: translateX(calc(-50% - var(--w) * .1625));
  }
  #n5:checked ~ .victory .sound { transform: translateX(-50%); }
  .sound-btn {
    width: 60px;
    height: 60px;
    border: 2px solid var(--gold);
    border-radius: 50%;
    overflow: hidden;
    background: var(--cream);
  }
  #victorySound { display: block; width: 300px; height: 60px; }
  .sound-hint {
    max-width: 80vw;
    text-align: center;
    font-size: 13px;
    letter-spacing: .5px;
    color: var(--gold);
  }

  /* Confetti, pure CSS: each piece falls once when the win screen opens */
  .victory i {
    position: fixed;
    top: -14px;
    left: var(--l);
    width: var(--s);
    height: var(--s);
    background: var(--c);
    opacity: 0;
    pointer-events: none;
    animation: fall var(--d) linear var(--w) 1 both;
  }
  @keyframes fall {
    from { opacity: 1; transform: translateY(0) rotate(0deg); }
    to   { opacity: 0; transform: translateY(110vh) rotate(540deg); }
  }

  @media (prefers-reduced-motion: reduce) {
    #noBtn { transition: opacity .35s ease; }
    .no-r { animation: none !important; }
  }
</style>
<noscript>
  <style>
    /* With scripts blocked the sound cannot start by itself, so show its play button on the win screen */
    .sound { display: flex; }
  </style>
</noscript>

/AAAAfEAAAH5AAAB8AAAAfgAAAImAAACBwAAAfUAAAHdAAACAAAAAgAAAAIAAAACAAAAAgAAAAIAAAACAAAAAjUAAAICAAAB6gAAAeIAAAIGAAAB9wAAAgAAAAIAAAACAQAAAf8AAAIAAAACLwAAAggAAAIBAAAB3wAAAfMAAAH/AAAB+QAAAf4AAAIDAAAB/QAAAgAAAAITAAACCQAAAgoAAAHtAAAB7QAAAgAAAAIAAAACAAAAAgAAAAIAAAACAAAAAgwAAAIQAAAB8AAAAfQAAAIAAAACAAAAAgAAAAIAAAACAAAAAgAAAAIAAAACAAAAAgAAAAIIAAAB+AAAAgAAAAIAAAACAAAAAgMAAAH9AAACAAAAAgAAAAIAAAACAAAAAgAAAAIAAAACJwAAAfAAAAHpAAACAAAAAgAAAAIAAAACAAAAAgAAAAIAAAACAAAAAgAAAAIAAAACAAAAAxwAAAHpAAABxQAAAcEAAAHdAAAB4wAAAgQAAAH1AAAB+AAAAfQAAAH+AAAB9wAAAg0AAAH5AAACBAAAAiwAAAIGAAAB6QAAAdwAAAIFAAACBgAAAfgAAAH5AAAB9AAAAfUAAAH+AAACBAAAAgUAAAH5AAACMgAAAgIAAAHpAAAB5gAAAfIAAAIAAAACAAAAAgAAAAIAAAACAAAAAgAAAAIAAAACAAAAAgUAAAIIAAAB/QAAAfsAAAH7AAACAAAAAgAAAAIAAAACAAAAAgAAAAIAAAACAAAAAgAAAAInAAAB7QAAAewAAAIZAAAB+AAAAfMAAAH8AAACAAAAAgAAAAIAAAACAAAAAgAAAAILAAACJwAAAgUAAAHpAAAB4QAAAf8AAAIAAAACAAAAAgAAAAIAAAACAAAAAgAAAAIAAAACAAAAAj4AAAH+AAAB6gAAAeMAAAH3AAACAAAAAgAAAAIAAAACAAAAAgAAAAIAAAACAAAAAjkAAAIJAAAB6gAAAeoAAAHqAAACAAAAAgAAAAIAAAACAAAAAgYAAAIKAAACAwAAAfwAAAH/AAACAQAAAfEAAAIAAAACAAAAAgAAAAIAAAACAAAAAgAAAAIAAAACAAAAAgAAAAICAAAB/gAAAgAAAAIAAAACAAAAAgAAAAIAAAACAAAAAgAAAAIAAAACAAAAAgIAAAH+AAACAAAAAgAAAAIAAAACAAAAAgAAAAIAAAACAAAAAgAAAAIAAAACAAAAAigAAAIHAAACBQAAAdUAAAH3AAACAAAAAgAAAAIAAAACAAAAAgAAAAIAAAAC8QAAAgUAAAHEAAAB0wAAAegAAAHyAAAB8QAAAe4AAAHmAAAB/wAAAhEAAAIPAAACBgAAAfgAAAHxAAAB+wAAAhEAAAIJAAACAwAAAf0AAAHlAAACDgAAAhIAAAH7AAAB5gAAAdoAAAHxAAACAAAAAgAAAAIAAAACAAAAAgAAAAIAAAACAAAAAgAAAAIAAAACAQAAAf8AAAIAAAACAAAAAgAAAAIAAAACAgAAAf4AAAIAAAACEAAAAfAAAAIAAAACAAAAAgwAAAITAAACEwAAAgYAAAIPAAACBAAAAe4AAAHaAAAB7QAAAgEAAAH/AAACAAAAAgAAAAIAAAACEgAAAfkAAAIOAAAB+QAAAfkAAAH1AAACAAAAAgAAAAIAAAACCwAAAikAAAIOAAACAQAAAgUAAAH8AAAB8wAAAekAAAHnAAAB+QAAAgAAAAIAAAACAAAAAgAAAAIAAAACAAAAAgAAAAIAAAACAAAAAhMAAAHtAAACAAAAAgAAAAITAAACBAAAAgkAAAILAAAB8AAAAfQAAAHxAAACAAAAAgAAAAIAAAACAAAAAgAAAAIAAAACAAAAAgAAAAIAAAACAAAAAgAAAAIAAAACAAAAAgAAAAIuAAACuAAAAgoAAAIQAAACBQAAAfIAAAH6AAAB8AAAAfcAAAHxAAAB0gAAAdkAAAHrAAAB+AAAAfUAAAH2AAAB6wAAAfsAAAH2AAAB       </div>
      <p class="sound-hint">Tap again to play the victory sound</p>
    </div>
    <label class="close-btn" id="closeBtn" for="won">Close</label>
  </div>

<script>
(function () {
  'use strict';

  var yesBtn = document.getElementById('yesBtn');
  var noBtn = document.getElementById('noBtn');
  var noSlot = document.getElementById('noSlot');
  var toast = document.getElementById('toast');
  var won = document.getElementById('won');
  var closeBtn = document.getElementById('closeBtn');
  var sound = document.getElementById('victorySound');

  var MAX_MISSES = 5;
  var PAD = 10;
  var misses = 0;
  var undocked = false;
  var gone = false;
  var lastFlee = 0;
  var curX = 0;
  var curY = 0;

  function viewport() {
    return { w: document.documentElement.clientWidth || window.innerWidth, h: window.innerHeight };
  }

  function clamp(v, lo, hi) { return Math.min(Math.max(v, lo), Math.max(lo, hi)); }

  // Take NO out of the row and pin it to the window at exactly where it was standing,
  // leaving an empty slot so YES does not shift.
  function undock() {
    if (undocked) return;
    var r = noBtn.getBoundingClientRect();
    noSlot.style.width = r.width + 'px';
    noSlot.style.height = r.height + 'px';
    noBtn.style.transition = 'none';
    noBtn.style.position = 'fixed';
    noBtn.style.margin = '0';
    noBtn.style.zIndex = '100';
    curX = r.left;
    curY = r.top;
    noBtn.style.left = curX + 'px';
    noBtn.style.top = curY + 'px';
    void noBtn.offsetWidth;
    noBtn.style.transition = '';
    undocked = true;
  }

  function noCenter() {
    if (!undocked) {
      var r = noBtn.getBoundingClientRect();
      return { x: r.left + r.width / 2, y: r.top + r.height / 2 };
    }
    return { x: curX + noBtn.offsetWidth / 2, y: curY + noBtn.offsetHeight / 2 };
  }

  function nearNo(px, py, radius) {
    var c = noCenter();
    return Math.hypot(px - c.x, py - c.y) < radius;
  }

  function overYes(px, py) {
    var r = yesBtn.getBoundingClientRect();
    return px >= r.left && px <= r.right && py >= r.top && py <= r.bottom;
  }

  // Pick a spot fully inside the window, away from the pointer and not on top of YES
  function pickSpot(px, py) {
    var v = viewport();
    var w = noBtn.offsetWidth;
    var h = noBtn.offsetHeight;
    var maxX = v.w - w - PAD;
    var maxY = v.h - h - PAD;
    var yr = yesBtn.getBoundingClientRect();
    var farEnough = Math.min(260, v.w * 0.5);
    var best = { x: clamp(PAD, PAD, maxX), y: clamp(PAD, PAD, maxY) };
    var bestScore = -Infinity;

    for (var i = 0; i < 60; i++) {
      var x = PAD + Math.random() * Math.max(0, maxX - PAD);
      var y = PAD + Math.random() * Math.max(0, maxY - PAD);
      var d = Math.hypot(x + w / 2 - px, y + h / 2 - py);
      var onYes = x < yr.right + 16 && x + w > yr.left - 16 && y < yr.bottom + 16 && y + h > yr.top - 16;
      var score = onYes ? d - 10000 : d;
      if (score > bestScore) { bestScore = score; best = { x: x, y: y }; }
      if (!onYes && d > farEnough) { best = { x: x, y: y }; break; }
    }
    return best;
  }

  function flee(px, py) {
    if (gone) return;
    var now = Date.now();
    if (now - lastFlee < 200) return;
    lastFlee = now;

    undock();
    misses++;

    if (misses >= MAX_MISSES) { vanish(); return; }

    var s = pickSpot(px, py);
    curX = s.x;
    curY = s.y;
    noBtn.style.left = curX + 'px';
    noBtn.style.top = curY + 'px';
    noBtn.style.transform = 'scale(' + (1 - misses * 0.1) + ')';
  }

  function vanish() {
    gone = true;
    noBtn.style.transform = 'scale(' + (1 - misses * 0.1) + ')';
    noBtn.style.opacity = '0';
    noBtn.style.pointerEvents = 'none';
    noBtn.tabIndex = -1;
    noBtn.setAttribute('aria-hidden', 'true');
    noSlot.style.width = '0px';
    noSlot.style.marginLeft = '0px';
    toast.classList.add('show');
    setTimeout(function () { toast.classList.remove('show'); }, 3200);
  }

  // Touch: jump away before the tap can land
  document.addEventListener('touchstart', function (e) {
    if (gone || !e.touches || !e.touches.length) return;
    var t = e.touches[0];
    if (overYes(t.clientX, t.clientY)) return;
    if (nearNo(t.clientX, t.clientY, 110)) {
      e.preventDefault();
      flee(t.clientX, t.clientY);
    }
  }, { passive: false });

  // Mouse (and a finger dragging): run away when the pointer gets close
  document.addEventListener('pointermove', function (e) {
    if (gone) return;
    var radius = e.pointerType === 'mouse' ? 120 : 100;
    if (overYes(e.clientX, e.clientY) && e.pointerType !== 'mouse') return;
    if (nearNo(e.clientX, e.clientY, radius)) flee(e.clientX, e.clientY);
  });

  // Fallbacks in case a touch or click still reaches the button (including keyboard)
  noBtn.addEventListener('pointerdown', function (e) { flee(e.clientX, e.clientY); });
  noBtn.addEventListener('click', function (e) {
    e.preventDefault();
    var c = noCenter();
    flee(e.detail === 0 ? c.x : e.clientX, e.detail === 0 ? c.y : e.clientY);
  });

  // Keep NO inside the window if the phone rotates or the toolbar changes the height
  function reclamp() {
    if (!undocked || gone) return;
    var v = viewport();
    curX = clamp(curX, PAD, v.w - noBtn.offsetWidth - PAD);
    curY = clamp(curY, PAD, v.h - noBtn.offsetHeight - PAD);
    noBtn.style.left = curX + 'px';
    noBtn.style.top = curY + 'px';
  }
  window.addEventListener('resize', reclamp);
  window.addEventListener('orientationchange', reclamp);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', reclamp);

  // YES opens the win screen by itself (no script needed). Scripts only add the sound.
  function stopSound() {
    try { sound.pause(); sound.currentTime = 0; } catch (err) {}
  }

  yesBtn.addEventListener('click', function () {
    try {
      sound.currentTime = 0;
      var p = sound.play();
      if (p && p.catch) p.catch(function () {});
    } catch (err) {}
  });

  closeBtn.addEventListener('click', stopSound);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { won.checked = false; stopSound(); }
  });

  // Last line on purpose: if anything above failed, this never runs and the script-free game stays in charge.
  document.documentElement.classList.add('js');
})();
</script>
